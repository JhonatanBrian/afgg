<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para mi amor nala</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="frame">
    <section class="love-card">
      <div class="message">
        <p id="line1"></p>
        <p id="line2"></p>
        <p id="line3"></p>
        <p id="line4"></p>
        <p id="line5"></p>
        <p id="line6"></p>        
        <p id="signature"></p>
      </div>

      <div class="tree-area">
        <canvas id="treeCanvas"></canvas>
      </div>

      <div class="counter">
        <div>Mi amor por ti comenzó hace...</div>
        <div class="numbers">
          <span id="days">31</span> días
          <span id="hours">21</span> horas
          <span id="minutes">27</span> minutos
          <span id="seconds">35</span> segundos
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
